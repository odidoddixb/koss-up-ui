<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>골든타임 | 4번 혁신제품 지원 독립 데모</title><link rel="stylesheet" href="golden-time-innovation.css"><style>
body{margin:0;min-height:100vh;background:linear-gradient(#cbd7efbb,#cbd7efbb),url('img/office.jpg') center/cover fixed;font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif}.demo-tools{max-width:1190px;margin:20px auto 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#fffef7ec;border-radius:16px;padding:12px 18px;color:#334779}.demo-tools button{cursor:pointer;color:#fff;border:0;border-radius:10px;padding:10px 14px;background:#3b5798;font-weight:750}.demo-tools .reset{background:#a45b68}.demo-tools label{margin-left:auto;font-size:13px}.demo-note{max-width:1190px;margin:14px auto 24px;color:#34456f;font-weight:650;background:#ffffffe8;padding:12px;border-radius:12px}.demo-log{font-size:12px;white-space:pre-wrap;max-width:1190px;margin:0 auto 30px;background:#fffdeb;border:1px solid #ccdaf0;border-radius:12px;padding:12px;overflow:auto}#innovation{padding:2px 12px}
</style></head><body><div class="demo-tools"><strong>💜 4번 혁신제품 지원 · 단독 테스트</strong><button id="next">다음 날짜 →</button><button id="reset" class="reset">테스트 초기화</button><label>※ 날짜·예산은 이 페이지의 임시 데이터입니다.</label></div><main id="innovation"></main><p class="demo-note">이 페이지에는 5번 뉴스 화면과 6번 게임 시스템이 들어 있지 않습니다. 테스트용 임시 세션만 사용하며, 실제 점수·뉴스는 팀 통합 후 공용 모듈이 처리합니다.</p><pre id="log" class="demo-log"></pre><script src="golden-time-innovation.js"></script><script>
// 독립 데모만을 위한 최소한의 임시 session. 실제 게임에서는 1번이 생성한 공용 session을 전달합니다.
const SAVE='gti-4-only-demo-session';
let demo;try{demo=JSON.parse(localStorage.getItem(SAVE)||'null');}catch{};
if(!demo||!Number.isInteger(demo.day))demo={day:1,budget:3000,outcomes:[]};
const session={getState:()=>({...demo}),applyOutcome(outcome){demo.outcomes.push(outcome);demo.budget+=outcome.budgetDelta||0;localStorage.setItem(SAVE,JSON.stringify(demo));return {...demo};}};
const innovation=GoldenTimeInnovation.create({session,mount:document.getElementById('innovation'),saveKey:'gti-4-only-demo-progress',onChange:update});
function update(){document.getElementById('log').textContent='테스트 기록 (6번 점수 계산 아님)\n'+JSON.stringify({day:demo.day,budget:demo.budget,decisions:innovation.getData().decisions,evaluated:innovation.getData().evaluated,outcomes:demo.outcomes},null,2);}
innovation.resolveDue(demo.day);innovation.render();update();
document.getElementById('next').addEventListener('click',()=>{if(demo.day>=5){alert('DAY 5까지 완료했습니다.');return;}const c=GoldenTimeInnovation.CASES.find(c=>c.day===demo.day);if(c&&!innovation.getData().decisions[c.id]){alert('오늘 기업 심사 결정을 먼저 완료하세요.');return;}demo.day++;localStorage.setItem(SAVE,JSON.stringify(demo));innovation.resolveDue(demo.day);innovation.render();update();});
document.getElementById('reset').addEventListener('click',()=>{if(!confirm('4번 단독 테스트 기록을 초기화할까요?'))return;localStorage.removeItem(SAVE);localStorage.removeItem('gti-4-only-demo-progress');location.reload();});
</script></body></html>
